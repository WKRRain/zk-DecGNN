[package]
name = "spartan-zeno-zk"
version = "0.1.0"
edition = "2021"
description = "Spartan-ZENO 通用图模型安全推理方案 - 零知识证明底层密码学实现"
authors = ["Spartan-ZENO Team"]
license = "MIT"

[dependencies]
# Arkworks 核心密码学库 (基于 Curve25519 / Ristretto)
ark-ff = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
ark-serialize = "0.4"
ark-poly = "0.4"

# Curve25519 支持 (包含 ristretto255 素数阶群抽象)
ark-curve25519 = { version = "0.4", features = ["r1cs"] }

# Poseidon 哈希
ark-crypto-primitives = { version = "0.4", features = ["sponge"] }

# 序列化与编码
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"
sha2 = "0.10"

# 随机数生成
rand = "0.8"
rand_core = "0.6"
rand_chacha = "0.3"

# 工具
itertools = "0.13"
num-traits = "0.2"
rayon = "1.10"
thiserror = "2"

# Python 绑定 (PyO3) — 用于与 Python 预处理侧交互。
#
# Do not enable `extension-module` by default: it intentionally avoids linking
# libpython, which makes `cargo test --lib` fail on Linux. The local benchmark
# loader imports the generated cdylib directly and works with the regular PyO3
# link mode used here.
pyo3 = { version = "0.22", features = ["auto-initialize"] }
numpy = "0.22"

[lib]
name = "spartan_zeno_zk"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
